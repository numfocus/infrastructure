name: Project Requests
description: Infrastructure request for NumFOCUS project that doesn't fit in other categories
labels: ["Request - Other"]

body:
  - type: input
    id: project
    attributes:
      label: Project
      description: >
        Which NumFOCUS-sponsored project do you represent?
    validations:
      required: true

  - type: textarea
    id: observations
    attributes:
      label: Request details
      description: >
        Describe the infrastructure you need and how it will support your project.
    validations:
      required: true
