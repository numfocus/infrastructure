name: Benchmarks
description: Request running your project benchmarks on stable hardware provided by NumFOCUS
labels: ["Request - Benchmarks"]

body:
  - type: input
    id: project
    attributes:
      label: Project
      description: >
        Which NumFOCUS-sponsored project do you represent?
    validations:
      required: true

  - type: textarea
    id: hardware_requirements
    attributes:
      label: Hardware Requirements
      description: >
        Please let us know what hardware you need to run your benchmarks
    validations:
      required: true

  - type: textarea
    id: cost_estimation
    attributes:
      label: Cost Estimation
      description: >
        Please let us know your estimated cost of running the benchmarks, or state that it is unknown
    validations:
      required: true

  - type: textarea
    id: observations
    attributes:
      label: Observations
      description: >
        Please let us know if there is any other information you'd like to provide
    validations:
      required: false
